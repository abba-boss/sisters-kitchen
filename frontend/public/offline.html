<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Sisters Kitchen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #FFFBF7 0%, #FFF5ED 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .offline-container {
      text-align: center;
      max-width: 500px;
      background: white;
      padding: 48px 32px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #FF7A59 0%, #FF9478 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    h1 {
      color: #1F2937;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: #6B7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .retry-button {
      display: inline-block;
      background: linear-gradient(135deg, #FF7A59 0%, #FF9478 100%);
      color: white;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 122, 89, 0.3);
    }

    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 122, 89, 0.4);
    }

    .retry-button:active {
      transform: translateY(0);
    }

    .tips {
      margin-top: 32px;
      padding-top: 32px;
      border-top: 1px solid #E5E7EB;
      text-align: left;
    }

    .tips h3 {
      color: #1F2937;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .tips ul {
      list-style: none;
      color: #6B7280;
      font-size: 14px;
      line-height: 1.8;
    }

    .tips li::before {
      content: "✓ ";
      color: #FF7A59;
      font-weight: bold;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Don't worry, we'll get you back online!</p>
    
    <button class="retry-button" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="tips">
      <h3>Quick Tips:</h3>
      <ul>
        <li>Check your WiFi or mobile data connection</li>
        <li>Try turning airplane mode on and off</li>
        <li>Move to an area with better signal</li>
        <li>Restart your router if using WiFi</li>
      </ul>
    </div>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      console.log('✅ Connection restored!');
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });

    // Check connection status
    if (navigator.onLine) {
      window.location.reload();
    }
  </script>
</body>
</html>
